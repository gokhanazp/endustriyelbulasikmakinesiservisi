<svg viewBox="0 0 800 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Endüstriyel bulaşık makinesi illüstrasyonu">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#dbe6fb"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="0.5" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="steelDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e40af"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
  </defs>

  <rect width="800" height="620" fill="url(#bg)"/>

  <!-- zemin gölge -->
  <ellipse cx="400" cy="560" rx="290" ry="30" fill="#0f172a" opacity="0.08"/>

  <!-- buhar -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="300" cy="120" r="26"/>
    <circle cx="340" cy="95" r="34"/>
    <circle cx="392" cy="110" r="28"/>
    <circle cx="360" cy="140" r="30"/>
  </g>
  <g fill="#ffffff" opacity="0.5">
    <circle cx="470" cy="130" r="22"/>
    <circle cx="505" cy="108" r="28"/>
    <circle cx="540" cy="128" r="20"/>
  </g>

  <!-- makine gövdesi -->
  <rect x="210" y="250" width="380" height="300" rx="22" fill="url(#steel)" stroke="#94a3b8" stroke-width="3"/>
  <!-- hood (kaldırılmış kapak) -->
  <rect x="235" y="175" width="330" height="95" rx="20" fill="url(#steelDark)" stroke="#64748b" stroke-width="3"/>
  <rect x="270" y="150" width="260" height="40" rx="14" fill="url(#steel)" stroke="#94a3b8" stroke-width="2"/>

  <!-- yıkama haznesi (cam) -->
  <rect x="255" y="300" width="290" height="200" rx="14" fill="#bfdbfe" opacity="0.55" stroke="#93c5fd" stroke-width="2"/>
  <!-- sepet + tabaklar -->
  <g stroke="#3b82f6" stroke-width="4" opacity="0.7" fill="none">
    <line x1="285" y1="330" x2="285" y2="470"/>
    <line x1="330" y1="330" x2="330" y2="470"/>
    <line x1="375" y1="330" x2="375" y2="470"/>
    <line x1="420" y1="330" x2="420" y2="470"/>
    <line x1="465" y1="330" x2="465" y2="470"/>
    <line x1="510" y1="330" x2="510" y2="470"/>
  </g>
  <g fill="#ffffff" stroke="#93c5fd" stroke-width="2">
    <circle cx="307" cy="390" r="26"/>
    <circle cx="397" cy="390" r="26"/>
    <circle cx="487" cy="390" r="26"/>
  </g>

  <!-- kontrol paneli -->
  <rect x="210" y="250" width="380" height="46" rx="14" fill="url(#panel)"/>
  <circle cx="250" cy="273" r="11" fill="url(#gold)"/>
  <circle cx="288" cy="273" r="8" fill="#60a5fa"/>
  <rect x="470" y="264" width="90" height="18" rx="9" fill="#1e3a8a"/>
  <rect x="478" y="269" width="50" height="8" rx="4" fill="#fbbf24"/>

  <!-- kapı kolu -->
  <rect x="360" y="512" width="80" height="14" rx="7" fill="url(#steelDark)"/>

  <!-- ayaklar -->
  <rect x="240" y="550" width="20" height="34" rx="6" fill="#64748b"/>
  <rect x="540" y="550" width="20" height="34" rx="6" fill="#64748b"/>

  <!-- teknik servis rozeti (anahtar) -->
  <g transform="translate(560,430)">
    <circle cx="0" cy="0" r="58" fill="url(#panel)"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <path d="M14 -18 a20 20 0 1 0 4 22 l16 16 8 -8 -16 -16 a20 20 0 0 0 -4 -22 l-9 9 -7 -7 z"
          fill="#fbbf24" transform="translate(-6,-4) scale(1.1)"/>
  </g>

  <!-- altın parıltılar -->
  <g fill="url(#gold)">
    <path d="M170 210 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 z"/>
    <path d="M620 200 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z"/>
    <path d="M150 430 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z"/>
  </g>
</svg>
